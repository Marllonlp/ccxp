<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Verification of Sprites and HUD</title>
</head>
<body>
<canvas id="canvas" width="960" height="540"></canvas>
<script type="module">
  import { Player, desenharVidas, byteSprites, heartSprites } from './src/player.js';

  window.addEventListener('error', (e) => {
    fetch('/report', { method: 'POST', body: JSON.stringify(['ERROR_EVENT: ' + e.message + ' at ' + e.filename + ':' + e.lineno]) });
  });

  const results = [];
  function assert(condition, message) {
    if (condition) {
      results.push('PASS: ' + message);
      console.log('PASS: ' + message);
    } else {
      results.push('FAIL: ' + message);
      console.error('FAIL: ' + message);
    }
  }

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // 1. Instância do jogador
  const player = new Player(100, 200);
  assert(player.estadoAnimacao === 'parado', 'Estado inicial é parado');
  assert(player.olhandoDireita === true, 'Inicialmente olhando para a direita');

  // 2. Transições de estado de animação
  player.vx = 300;
  player.noChao = true;
  player.atualizar(0.016);
  assert(player.estadoAnimacao === 'correndo', 'Com vx > 0 e noChao, estado é correndo');
  assert(player.olhandoDireita === true, 'Com vx > 0, olhandoDireita é true');

  player.vx = -300;
  player.atualizar(0.016);
  assert(player.estadoAnimacao === 'correndo', 'Com vx < 0 e noChao, estado é correndo');
  assert(player.olhandoDireita === false, 'Com vx < 0, olhandoDireita é false');

  player.vx = 0;
  player.noChao = false;
  player.vy = -400;
  player.atualizar(0.016);
  assert(player.estadoAnimacao === 'pulando', 'Com !noChao e vy < 0, estado é pulando');

  player.vy = 200;
  player.atualizar(0.016);
  assert(player.estadoAnimacao === 'caindo', 'Com !noChao e vy >= 0, estado é caindo');

  player.agachado = true;
  player.atualizar(0.016);
  assert(player.estadoAnimacao === 'agachado', 'Com agachado = true, estado é agachado');

  player.vidas = 0;
  player.atualizar(0.016);
  assert(player.estadoAnimacao === 'morte', 'Com vidas = 0, estado é morte');

  // 3. Teste de desenho do jogador sem erros
  player.retornar(100, 200);
  let desenhouSemErro = true;
  try {
    player.desenhar(ctx);
  } catch (e) {
    desenhouSemErro = false;
    console.error(e);
  }
  assert(desenhouSemErro, 'player.desenhar executou sem erros');

  // 4. Teste de desenho das vidas (HUD de corações)
  let vidasDesenhouSemErro = true;
  try {
    desenharVidas(ctx, 3);
    desenharVidas(ctx, 2);
    desenharVidas(ctx, 1);
    desenharVidas(ctx, 0);
  } catch (e) {
    vidasDesenhouSemErro = false;
    console.error(e);
  }
  assert(vidasDesenhouSemErro, 'desenharVidas executou sem erros para 3, 2, 1 e 0 vidas');

  // 5. Verificar que sprites foram instanciados
  assert(byteSprites.parado && byteSprites.correndo && byteSprites.pulando, 'Sprites do Byte instanciados');
  assert(heartSprites.cheia && heartSprites.vazia && heartSprites.ultima, 'Sprites dos corações instanciados');

  fetch('/report', { method: 'POST', body: JSON.stringify(results) });
</script>
</body>
</html>
